name: Atualizar feed

# O agendador do GitHub atrasa muito em repositórios pequenos (na prática rodava a cada
# ~6 h). Por isso cada execução agendada fica ~5 h no ar coletando a cada 30 min, e o
# cron só precisa reiniciar o ciclo: a próxima execução espera na fila e começa assim
# que a anterior termina.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches-ignore: [gh-pages]
    paths: ["backend/**", "web/**", ".github/workflows/update-feed.yml"]

permissions:
  contents: write

concurrency:
  # Um push (teste rápido) não fica preso atrás do ciclo longo.
  group: update-feed-${{ github.event_name == 'push' && 'push' || 'loop' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      # push: uma coleta só; agendado/manual: 11 coletas, 30 min entre elas (~5 h).
      ROUNDS: ${{ github.event_name == 'push' && '1' || '11' }}
      INTERVAL: "1800"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Testes
        working-directory: backend
        run: python -m pytest -q

      - name: Abrir branch gh-pages em ./site
        run: |
          if git fetch --depth=1 origin gh-pages; then
            git worktree add site FETCH_HEAD
          else
            mkdir site
          fi

      # Sempre um único commit na gh-pages: o histórico não cresce a cada rodada,
      # e o push mantém o repositório "ativo" (o GitHub desliga crons parados há 60 dias).
      - name: Coletar e publicar
        env:
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          # Radar: chaves opcionais (Settings → Secrets and variables → Actions). Sem elas, a
          # seção de focos de calor avisa que falta a chave e o OpenSky roda no limite anônimo.
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: |
          for round in $(seq 1 "$ROUNDS"); do
            echo "::group::Rodada $round/$ROUNDS"
            # O ciclo dura horas: a cada rodada pega a versão mais nova do backend,
            # para uma mudança publicada no meio do ciclo não ser desfeita por código antigo.
            # (os arquivos de dados do app alimentam o painel/geo.json do site)
            if [ "$round" -gt 1 ] && git fetch -q --depth=1 origin "$GITHUB_REF_NAME"; then
              git checkout -q FETCH_HEAD -- backend web android/app/src/main/java/com/abugdn/wid/data android/app/src/main/java/com/abugdn/wid/ui/MapScreen.kt
              pip install -q -r backend/requirements.txt
            fi
            if (cd backend && python -m wid.build --out ../site); then
              (
                cd site
                rm -rf .git
                git init -q -b gh-pages
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add -A
                git commit -q -m "feed $(date -u +%Y-%m-%dT%H:%MZ)"
                git push -q -f "$PUSH_URL" gh-pages
              ) || echo "::warning::falha ao publicar na rodada $round"
            else
              echo "::warning::coleta falhou na rodada $round; mantendo o feed anterior"
            fi
            echo "::endgroup::"
            if [ "$round" -lt "$ROUNDS" ]; then sleep "$INTERVAL"; fi
          done
