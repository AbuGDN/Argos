name: Teste de fumaça

# BRANCH DE TESTE: mede o ML Kit com nomes protegidos (ProbeTest). Não vai para a main.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: x86_64 para o emulador
        working-directory: android
        run: |
          sed -i 's/abiFilters += listOf("arm64-v8a", "armeabi-v7a")/abiFilters += listOf("arm64-v8a", "armeabi-v7a", "x86_64")/' app/build.gradle.kts
          ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Liberar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador e medição
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd android && ./gradlew connectedDebugAndroidTest --no-daemon || true; adb logcat -d -s PROBE:I > ../probe.txt; cat ../probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: probe.txt
