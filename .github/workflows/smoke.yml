name: Teste de fumaça

# Instala o APK num emulador, navega pelas telas e mostra crashes (logcat). Roda à mão ou
# quando este arquivo/o roteiro mudam. Não publica nada.
on:
  workflow_dispatch:
  push:
    branches-ignore: [gh-pages]
    paths: [".github/workflows/smoke.yml", ".github/smoke/**"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK (com x86_64 para o emulador)
        working-directory: android
        env:
          WID_VERSION_CODE: "9999"
        run: |
          # O APK publicado só tem ARM; o emulador precisa de x86_64 (ML Kit tem código nativo).
          sed -i 's/abiFilters += listOf("arm64-v8a", "armeabi-v7a")/abiFilters += listOf("arm64-v8a", "armeabi-v7a", "x86_64")/' app/build.gradle.kts
          grep -n abiFilters app/build.gradle.kts
          ./gradlew assembleRelease --no-daemon

      - name: Liberar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador e roteiro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/smoke/run.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            shots/
            crash.txt
            logcat.txt
