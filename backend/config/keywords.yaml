# Tags que bastam sozinhas para a notícia entrar (sem termo de guerra) e tags que não contam como
# região no filtro (precisam de outra região ou de 2 termos de guerra). Nenhuma das duas entra no
# Relógio do Argos (não são frentes de guerra).
standalone_tags: [ice]
weak_tags: [brasil]

# Palavras que marcam urgência no título.
urgent_terms: [urgente, breaking, "última hora", ao vivo agora, מבזק, عاجل]
