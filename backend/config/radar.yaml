      lang: pt
    - name: AFP Checamos
      url: "https://news.google.com/rss/search?q=site:checamos.afp.com+when:14d&hl=pt-BR&gl=BR&ceid=BR:pt-419"
      lang: pt
    - name: AFP Fact Check
      url: "https://news.google.com/rss/search?q=site:factcheck.afp.com+when:14d&hl=en-US&gl=US&ceid=US:en"
      lang: en
    - name: Misbar
      url: "https://news.google.com/rss/search?q=site:misbar.com+when:14d&hl=en-US&gl=US&ceid=US:en"
      lang: en
    - name: Snopes
      url: "https://www.snopes.com/feed/"
      lang: en
    - name: Full Fact
      url: "https://fullfact.org/feed/"
      lang: en

# Polymarket: probabilidades dos mercados de previsão sobre as guerras.
predictions:
  interval: 60
  max_events: 12

# --- Olhos militares (fontes abertas) ------------------------------------------------

# Aviões militares com transponder ligado (adsb.lol, sem chave). Só os que estão dentro
# das zonas. box: [sul, oeste, norte, leste]. Muitos voam com transponder desligado: o
# que aparece é o mínimo, não o total.
military:
  interval: 30
  zones:
    - {id: oriente_medio, name: Oriente Médio, tag: ira, box: [12.0, 25.0, 42.0, 63.0]}
    - {id: mar_negro, name: Mar Negro e Ucrânia, tag: ucrania_russia, box: [40.0, 22.0, 56.5, 45.0]}

# Porta-aviões dos EUA: acompanhamento semanal da frota (USNI News).
carriers:
  interval: 360
  url: "https://news.usni.org/category/fleet-tracker/feed"

# Linha de frente na Ucrânia (DeepStateMap): área ocupada e variação na semana.
frontline:
  interval: 360

# --- Alertas ---------------------------------------------------------------------------

# Sirenes em Israel (Tzeva Adom): alertas das últimas 24 h com as cidades. O app também consulta
# os alertas ao vivo enquanto a tela Sirenes está aberta.
sirens:
  interval: 25

# Sismógrafo (USGS, magnitude 2,5+ na última semana). box: [sul, oeste, norte, leste].
# sites: locais nucleares; sismo raso (até 5 km) perto deles vira alerta.
quakes:
