    - {name: Coreia do Norte, tag: asia, box: [37.6, 124.0, 43.0, 131.0]}
    - {name: Iraque, tag: iraque, box: [29.0, 38.8, 37.4, 48.6]}
    - {name: Turquia, tag: turquia, box: [35.8, 26.0, 42.1, 44.8]}
    - {name: Iêmen e Mar Vermelho, tag: iemen, box: [12.0, 32.0, 19.0, 54.0]}
    - {name: Ucrânia e oeste da Rússia, tag: ucrania_russia, box: [44.0, 22.0, 56.5, 45.0]}
    - {name: Paquistão e Índia (Caxemira), tag: asia, box: [24.0, 66.0, 36.5, 78.0]}
