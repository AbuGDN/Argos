# Fontes RSS. Uma fonte que falhar é ignorada naquela rodada; o status de cada
# uma fica em sources_status.json no site publicado, para podar as quebradas.
#
# url: uma URL ou uma lista de alternativas (tentadas em ordem)
# lang: pt | en | he | ar (hebraico e árabe são traduzidos no aparelho)
# origin: israel | arabe | eua | internacional | brasil (usado em "como cada lado noticiou")
# weight: peso na escolha do título de um grupo e no ranking (1.0 = normal)

sources:
  # --- Israel ---
  # Times of Israel bloqueia IPs do GitHub (403); se falhar, usa as manchetes via Google News
  # (links são redirecionamentos do Google, então o texto completo vem de outro veículo do grupo).
  - name: Times of Israel
    url:
      - "https://www.timesofisrael.com/feed/"
      - "https://news.google.com/rss/search?q=site:timesofisrael.com+when:2d&hl=en-US&gl=US&ceid=US:en"
    lang: en
    origin: israel
    weight: 1.2
  - {name: Jerusalem Post, url: "https://www.jpost.com/rss/rssfeedsheadlines.aspx", lang: en, origin: israel, weight: 1.1}
  - {name: Ynetnews, url: "https://www.ynetnews.com/Integration/StoryRss3089.xml", lang: en, origin: israel, weight: 1.1}
  - {name: Israel Hayom, url: "https://www.israelhayom.com/feed/", lang: en, origin: israel, weight: 1.0}

  # --- Mundo árabe / regional ---
  - {name: Al Jazeera, url: "https://www.aljazeera.com/xml/rss/all.xml", lang: en, origin: arabe, weight: 1.0}
  - {name: Middle East Eye, url: "https://www.middleeasteye.net/rss", lang: en, origin: arabe, weight: 0.9}

  # --- Imprensa local em hebraico e árabe (traduzida no aparelho) ---
  # Se o feed direto falhar (bloqueio de IP), usa as manchetes via Google News.
  - name: Ynet (hebraico)
